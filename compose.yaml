name: devops-lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    image: ${API_IMAGE:-devops-task-api:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-devops}
      API_TOKEN: ${API_TOKEN:?Run npm run setup first}
      PORT: '3000'
    ports:
      - '127.0.0.1:${API_PORT:-3080}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9095}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets: [api_token]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
secrets:
  api_token:
    environment: API_TOKEN
volumes:
  pgdata:
  prometheus-data:
